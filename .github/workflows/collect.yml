name: Daily AI News Collection

on:
  schedule:
    # GitHub の schedule は指定時刻に走らない。実測（2026-09-05〜09-14）では
    # cron 指定から一律 1h26m〜2h38m 遅れて起動し、さらに一部はドロップする
    # （2026-09-15 は 4 本中 2 本だけ起動し、公開が JST 7:46 になった）。SLA は無いので
    # 回避策は「遅延ぶんを見込んで早く撃つ」「本数を増やす」の 2 つだけ。
    #
    # 目標は JST 7:10 までの公開（生成 4 分 + Vercel ビルド数分）。ただし収集は実行時点の
    # RSS フィードを読むだけなので、前倒ししすぎると朝のニュースがそのぶん丸ごと欠ける。
    # 本命の着地上限が 6:30 になる位置（遅延最大 2h38m を引いて JST 3:52 指定）に置き、
    # 保険は 45 分間隔に詰めてドロップ時の遅れを小さくする。混雑する毎時 :00 は避ける。
    # 当日分が既にあれば以降の実行は guard ステップで全てスキップされるので二重実行は無害。
    - cron: '52 18 * * *'  # UTC 18:52 = JST 3:52 指定 → 実着地 JST 5:18〜6:30（本命）
    - cron: '37 19 * * *'  # UTC 19:37 = JST 4:37 指定 → 実着地 JST 6:03〜7:15（保険1）
    - cron: '22 20 * * *'  # UTC 20:22 = JST 5:22 指定 → 実着地 JST 6:48〜8:00（保険2）
    - cron: '07 21 * * *'  # UTC 21:07 = JST 6:07 指定 → 実着地 JST 7:33〜8:45（保険3・最終）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # 保険 cron の二重実行を防ぐ。当日分が既にある schedule 実行は以降を全てスキップ。
      # workflow_dispatch（手動）は強制再生成できるよう常に実行する。
      - name: Check if today's article already exists
        id: guard
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "articles/${DATE}.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "articles/${DATE}.md は生成済みのためスキップ"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        if: steps.guard.outputs.skip != 'true'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        working-directory: collector
        run: uv sync

      - name: Collect and generate news
        if: steps.guard.outputs.skip != 'true'
        working-directory: collector
        env:
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CI: "true"
        run: uv run python -m src.main

      - name: Commit articles
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/
          git diff --cached --quiet || git commit -m "Add AI news $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push

      - name: Upload MP3 to Release
        if: steps.guard.outputs.skip != 'true' && hashFiles('articles/*.mp3') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          MP3="articles/${DATE}.mp3"
          if [ -f "$MP3" ]; then
            gh release create "news-${DATE}" \
              --title "AI News ${DATE}" \
              --notes "AI・テクノロジーニュース ${DATE}" || true
            gh release upload "news-${DATE}" "$MP3" --clobber
          fi

      - name: Notify Discord
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 通知本文のリンク先。独自ドメインがあれば書き換える
          SITE_URL: "https://ainews-eight-theta.vercel.app"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL 未設定のため通知をスキップ"
            exit 0
          fi
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          # 本日分の記事数を index.json から取得（取れなければ md の見出し数で代用）
          COUNT=$(jq -r --arg d "$DATE" '.articles[] | select(.date==$d) | .article_count' articles/index.json 2>/dev/null | head -1)
          [ -z "$COUNT" ] && COUNT=$(grep -c '^### ' "articles/${DATE}.md" 2>/dev/null || echo "?")
          # 本日のトップ見出しを1行だけ抜粋
          TOP=$(grep -m1 '^### ' "articles/${DATE}.md" 2>/dev/null | sed 's/^### //')
          CONTENT=$(printf '📰 本日のAIニュース %s（%s件）が揃いました！\n%s\n%s' \
            "$DATE" "$COUNT" "${TOP:+▸ $TOP}" "$SITE_URL")
          PAYLOAD=$(jq -n --arg c "$CONTENT" '{content: $c}')
          curl -fsS -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" \
            && echo "Discord 通知を送信しました" || echo "Discord 通知の送信に失敗（処理は継続）"

      # 失敗が無音だと記事が来ないことでしか気付けない（2026-09-11 / 09-13 は2日間気付けなかった）。
      # 保険 cron の本数だけ通知が飛ぶが、鳴り止まないこと自体が「まだ直っていない」の合図。
      - name: Notify Discord on failure
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL 未設定のため通知をスキップ"
            exit 0
          fi
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          CONTENT=$(printf '⚠️ AIニュース %s の生成に失敗しました\n%s' "$DATE" "$RUN_URL")
          PAYLOAD=$(jq -n --arg c "$CONTENT" '{content: $c}')
          curl -fsS -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" \
            && echo "失敗通知を送信しました" || echo "失敗通知の送信に失敗"
